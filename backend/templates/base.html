<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5c2f">
    <link rel="manifest" href="/manifest.json">
    <title>{% block title %}Lako{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f5c2f;
            --primary-dark: #0a4a25;
            --secondary: #5a6e5a;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --background: linear-gradient(145deg, #e8f0e8 0%, #cde0cd 100%);
            --surface: rgba(255, 255, 255, 0.95);
            --text-primary: #1a2a1f;
            --text-secondary: #5a6e5a;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-outline:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #991b1b; }
        .glass-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(15, 92, 47, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }
        .alert-error { background: rgba(220, 38, 38, 0.1); color: #dc2626; }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #059669; }
        form .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 92, 47, 0.1);
        }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/logout';
            }
        }
        
        // Check for flash messages and show toasts
        document.addEventListener('DOMContentLoaded', () => {
            const errors = document.querySelectorAll('[data-flash-error]');
            const success = document.querySelectorAll('[data-flash-success]');
            
            errors.forEach(el => showToast(el.textContent, 'error'));
            success.forEach(el => showToast(el.textContent, 'success'));
        });
    </script>
    {% block extra_script %}{% endblock %}
</body>
</html>
